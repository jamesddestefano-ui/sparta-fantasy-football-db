name: Yahoo sign-in (one time)

# Phone-friendly replacement for scripts/yahoo_auth.py. Paste the code Yahoo
# gives you (or the whole https://localhost:8080/?code=... address) and this
# stores YAHOO_REFRESH_TOKEN as a repository secret. Yahoo codes expire within
# minutes, so run it right after tapping Agree.
# Needs secrets: YAHOO_CLIENT_ID, YAHOO_CLIENT_SECRET, YAHOO_REDIRECT_URI,
# SPARTA_SECRETS_PAT (fine-grained token: this repo only, Secrets read/write).

on:
  workflow_dispatch:
    inputs:
      code:
        description: 'Code from Yahoo, or the whole localhost address it sent you to'
        required: true
        type: string

permissions:
  contents: read

jobs:
  signin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mask the code
        env:
          CODE: ${{ inputs.code }}
        run: echo "::add-mask::$CODE"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Exchange code and verify Sparta access
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REDIRECT_URI: ${{ secrets.YAHOO_REDIRECT_URI }}
          YAHOO_AUTH_CODE: ${{ inputs.code }}
        run: python scripts/yahoo_signin_ci.py --token-file "$RUNNER_TEMP/rt"
      - name: Save refresh token as repository secret
        env:
          GH_TOKEN: ${{ secrets.SPARTA_SECRETS_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add the SPARTA_SECRETS_PAT secret so this run can save YAHOO_REFRESH_TOKEN."; exit 1
          fi
          gh secret set YAHOO_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/rt"
          rm -f "$RUNNER_TEMP/rt"
          echo "Saved YAHOO_REFRESH_TOKEN. Now run 'Sparta Yahoo API sync'." | tee -a "$GITHUB_STEP_SUMMARY"
