name: Sparta FantasyPros manual Week 6 pilot
on:
  workflow_dispatch:
    inputs:
      confirmed_request_budget:
        description: 'Request cap: 0 for preflight; 3 for a quota-verified or explicitly user-authorized pilot'
        required: true
        default: '0'
        type: choice
        options: ['0', '3']
      quota_evidence:
        description: 'Reference to verified provider quota evidence; never enter credentials'
        required: false
        default: ''
        type: string
      user_authorized_unknown_quota:
        description: 'Explicit owner authorization for one pilot despite unknown remaining quota'
        required: true
        default: false
        type: boolean
      credential_rotated:
        description: 'Confirm the repository key was rotated after chat exposure'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: sparta-fantasypros-pilot
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0 # Full suite reproduces the immutable historical audit from Git.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install justified OpenAPI schema validator
        run: python -m pip install --disable-pip-version-check -r requirements-fantasypros.txt
      - name: Offline unit and contract tests before any provider requests
        run: python -m unittest discover -s tests -v
      - name: Validate authoritative Sparta state
        run: python scripts/validate_sparta.py
      - name: Report existing learning validation failures without rewriting history
        id: learning
        continue-on-error: true
        run: python scripts/validate_learning.py
      - name: Check secret presence and confirmed quota without exposing values
        id: preflight
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
          CONFIRMED_REQUEST_BUDGET: ${{ inputs.confirmed_request_budget }}
          QUOTA_EVIDENCE: ${{ inputs.quota_evidence }}
          CREDENTIAL_ROTATED: ${{ inputs.credential_rotated }}
          USER_AUTHORIZED_UNKNOWN_QUOTA: ${{ inputs.user_authorized_unknown_quota }}
          PREFLIGHT_SUMMARY: ${{ runner.temp }}/fantasypros-preflight.json
        run: python scripts/fantasypros_actions.py
      - name: Three-request read-only Week 6 pilot
        id: ingestion
        if: steps.preflight.outputs.live_permitted == 'true'
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: >-
          python scripts/fantasypros_ingest.py --season 2026 --week 6
          --credential-rotated --request-budget 3 --retries 0
          --output-dir "$RUNNER_TEMP/fantasypros-pilot"
          --audit-summary "$RUNNER_TEMP/fantasypros-audit.json"
      - name: Publish only sanitized counts and validation status
        if: always()
        env:
          LEARNING_STATUS: ${{ steps.learning.outcome }}
          INGESTION_STATUS: ${{ steps.ingestion.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          preflight = root / 'fantasypros-preflight.json'
          report = json.loads(preflight.read_text()) if preflight.exists() else {'status': 'PREFLIGHT_NOT_REACHED'}
          report['learning_validation'] = os.environ['LEARNING_STATUS']
          report['ingestion_status'] = os.environ['INGESTION_STATUS']
          report['api_requests'] = 3 if os.environ['INGESTION_STATUS'] == 'success' else 0 if os.environ['INGESTION_STATUS'] == 'skipped' else None
          report['endpoints'] = []
          audit = root / 'fantasypros-audit.json'
          if audit.exists():
              report.update(json.loads(audit.read_text()))
          target = root / 'fantasypros-summary'
          target.mkdir(exist_ok=True)
          (target / 'summary.json').write_text(json.dumps(report, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('```json\n' + json.dumps(report, indent=2) + '\n```\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fantasypros-sanitized-validation-summary
          path: ${{ runner.temp }}/fantasypros-summary/summary.json
          retention-days: 1
          if-no-files-found: ignore
