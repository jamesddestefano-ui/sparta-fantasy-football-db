name: Sparta weekly evidence collection
on:
  schedule:
    # Paired UTC hours; resolver admits exactly the requested ET hour across DST.
    - cron: '0 13,14 * * 2'
    - cron: '0 18,19 * * 2'
    - cron: '0 14,15 * * 6'
    - cron: '30 14,15 * * 0'
  workflow_dispatch:
    inputs:
      job:
        description: Evidence job
        required: true
        type: choice
        options: [report_card, waivers, injuries, lineup_check]
permissions:
  contents: write
concurrency:
  group: sparta-weekly-evidence
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install existing validation dependency
        run: python -m pip install --disable-pip-version-check -r requirements-fantasypros.txt
      - name: Resolve ET schedule
        id: schedule
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_JOB: ${{ inputs.job }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo "job=$MANUAL_JOB" >> "$GITHUB_OUTPUT"
          else
            python scripts/sparta_collect.py --resolve-schedule "$EVENT_SCHEDULE" >> "$GITHUB_OUTPUT"
          fi
      - name: Offline tests and governance checks
        if: steps.schedule.outputs.run == 'true'
        run: |
          python -m unittest discover -s tests
          python scripts/validate_sparta.py
          python scripts/validate_learning.py
          python scripts/learning_regression_gate.py --comparison-ref "$(git rev-parse HEAD)"
      - name: Collect evidence (optional approved Yahoo GETs only)
        if: steps.schedule.outputs.run == 'true'
        env:
          JOB: ${{ steps.schedule.outputs.job }}
          SPARTA_YAHOO_API_APPROVED: ${{ vars.SPARTA_YAHOO_API_APPROVED }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
          YAHOO_REDIRECT_URI: ${{ secrets.YAHOO_REDIRECT_URI }}
          YAHOO_ROTATED_TOKEN_FILE: ${{ runner.temp }}/sparta_collect_rotated_rt
        run: |
          if [ "$SPARTA_YAHOO_API_APPROVED" = true ]; then
            python scripts/sparta_collect.py --job "$JOB" --refresh-yahoo
          else
            python scripts/sparta_collect.py --job "$JOB"
          fi
      - name: Preserve rotated OAuth token
        if: steps.schedule.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.SPARTA_SECRETS_PAT }}
        run: |
          if [ -s "$RUNNER_TEMP/sparta_collect_rotated_rt" ]; then
            if [ -n "$GH_TOKEN" ]; then
              gh secret set YAHOO_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/sparta_collect_rotated_rt"
            else
              echo '::warning::Yahoo rotated its token; the owner must refresh the existing secret.'
            fi
            rm -f "$RUNNER_TEMP/sparta_collect_rotated_rt"
          fi
      - name: Commit evidence with authenticated GitHub access
        if: steps.schedule.outputs.run == 'true'
        env:
          JOB: ${{ steps.schedule.outputs.job }}
        run: |
          git config user.name 'sparta-collector[bot]'
          git config user.email 'sparta-collector@users.noreply.github.com'
          git add intelligence/handoff/
          if [ -d data/yahoo_api/weekly ]; then git add data/yahoo_api/weekly/; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Collect Sparta $JOB evidence"
          git pull --rebase origin main
          # Regenerate against rebased sources without additional Yahoo or FantasyPros calls.
          python scripts/sparta_collect.py --job "$JOB"
          python scripts/validate_sparta.py
          python scripts/validate_learning.py
          python scripts/learning_regression_gate.py --comparison-ref "$(git rev-parse origin/main)"
          git add intelligence/handoff/
          if ! git diff --cached --quiet; then git commit -m "Refresh handoff against latest main"; fi
          # A concurrent push rejects this write safely; rerun instead of publishing stale evidence.
          git push origin HEAD:main
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
