name: Grok Pulse guard

# Repairs stale overwrites of the Grok Pulse mirror files right after they land.
# An external mirror job (grok.me /api/pulse, stuck on its 2026-10-19 pass) rewrites
# intelligence/grok_pulse_latest.json with an older pass and wipes the append-only
# intelligence/grok_pulse_history.jsonl. scripts/pulse_guard.py restores the newer pass
# and the full history (AGENTS.md rules 21-23). Pushes made with GITHUB_TOKEN don't
# trigger workflows, so the repair commit can't loop.

on:
  push:
    branches: [main]
    paths:
      - intelligence/grok_pulse_latest.json
      - intelligence/grok_pulse_history.jsonl
  workflow_dispatch:
    inputs:
      base:
        description: 'Trusted commit to compare against'
        required: true

permissions:
  contents: write

concurrency:
  group: sparta-pulse-guard
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 50
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Repair stale Pulse overwrites
        env:
          BASE: ${{ github.event.inputs.base || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then echo "No base"; exit 0; fi
          python scripts/pulse_guard.py --base "$BASE" | tee "$RUNNER_TEMP/guard.txt"
      - name: Commit repair
        run: |
          if git diff --quiet -- intelligence/grok_pulse_latest.json intelligence/grok_pulse_history.jsonl; then echo "Nothing to repair"; exit 0; fi
          git config user.name "sparta-pulse-guard[bot]"
          git config user.email "sparta-pulse-guard@users.noreply.github.com"
          git add intelligence/grok_pulse_latest.json intelligence/grok_pulse_history.jsonl
          git commit -q -m "pulse-guard: undo stale Grok mirror overwrite ($(cat "$RUNNER_TEMP/guard.txt"))"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "::error::Could not push pulse-guard repair"; exit 1
